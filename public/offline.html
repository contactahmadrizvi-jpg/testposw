<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - SOMO POS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    button {
      background: white;
      color: #667eea;
      border: none;
      padding: 15px 30px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.05);
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 2rem auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📡</h1>
    <h1>You're Offline</h1>
    <p>The POS system needs to load online at least once to cache the menu. Please check your internet connection and try again.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
    <div class="spinner" style="display: none;" id="spinner"></div>
    <p id="status" style="font-size: 0.9rem; margin-top: 1rem;"></p>
  </div>

  <script>
    // Auto-reload when connection returns
    window.addEventListener('online', () => {
      document.getElementById('status').textContent = 'Connection restored! Reloading...';
      document.getElementById('spinner').style.display = 'block';
      setTimeout(() => window.location.reload(), 1000);
    });

    // Check if we have cached data - if yes, try to load the app
    if (localStorage.getItem('offline_menu_items')) {
      document.getElementById('status').textContent = 'Menu data found in cache. The app should have loaded...';
      // Try to navigate to the app
      setTimeout(() => {
        window.location.href = '/pos-kitchen';
      }, 2000);
    }
  </script>
</body>
</html>
